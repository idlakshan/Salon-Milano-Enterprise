      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://offeringdb:3306/offeringdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      eurekaserver:
        condition: service_healthy
      offeringdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    networks:
      - idlakshan

  # ==========================================
  # BOOKING SERVICE
  # ==========================================

  bookingservice:
    image: idlakshan/milano-booking-service:latest
    container_name: bookingservice
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: booking-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://bookingdb:3306/bookingdb
      SPRING_DATASOURCE_USERNAME: root
