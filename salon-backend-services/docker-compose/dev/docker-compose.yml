services:
  # =========================
  # SINGLE SHARED DATABASE
  # =========================
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec docker-entrypoint.sh mysqld --init-file /opt/init.sql
    volumes:
      - mysqldb_data:/var/lib/mysql
      - ./init.sql:/opt/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot@123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - idlakshan


  # =========================
  # EUREKA SERVER
  # =========================

  eurekaserver:
    image: idlakshan/milano-eureka-server:latest
    container_name: eurekaserver
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - idlakshan


  # =========================
  # SERVICES
  # =========================

  userservice:
    image: idlakshan/milano-user-service:latest
    container_name: userservice
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: user-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  salonservice:
    image: idlakshan/milano-salon-service:latest
    container_name: salonservice
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: salon-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/salondb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  categoryservice:
    image: idlakshan/milano-category-service:latest
    container_name: categoryservice
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: category-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/categorydb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  offeringservice:
    image: idlakshan/milano-offering-service:latest
    container_name: offeringservice
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: offering-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/offeringdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  bookingservice:
    image: idlakshan/milano-booking-service:latest
    container_name: bookingservice
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: booking-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/bookingdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  paymentservice:
    image: idlakshan/milano-payment-service:latest
    container_name: paymentservice
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_APPLICATION_NAME: payment-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/paymentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - mysqldb
      - eurekaserver
    networks:
      - idlakshan


  gatewayserver:
    image: idlakshan/milano-gateway-server:latest
    container_name: gatewayserver
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      SPRING_APPLICATION_NAME: gateway-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver
    networks:
      - idlakshan


volumes:
  mysqldb_data:

networks:
  idlakshan:
    driver: bridge