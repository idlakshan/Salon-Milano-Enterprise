services:

  # ==========================================
  # DATABASES
  # ==========================================

  userdb:
    image: mysql:8.0
    container_name: userdb
    restart: unless-stopped
    ports:
      - "3301:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: userdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  salondb:
    image: mysql:8.0
    container_name: salondb
    restart: unless-stopped
    ports:
      - "3302:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: salondb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  bookingdb:
    image: mysql:8.0
    container_name: bookingdb
    restart: unless-stopped
    ports:
      - "3303:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: bookingdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  categorydb:
    image: mysql:8.0
    container_name: categorydb
    restart: unless-stopped
    ports:
      - "3304:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: categorydb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  paymentdb:
    image: mysql:8.0
    container_name: paymentdb
    restart: unless-stopped
    ports:
      - "3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: paymentdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  offeringdb:
    image: mysql:8.0
    container_name: offeringdb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: offeringdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - idlakshan

  # ==========================================
  # EUREKA SERVER
  # ==========================================

  eurekaserver:
    image: idlakshan/milano-eureka-server:latest
    container_name: eurekaserver
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8761/actuator/health/readiness | grep UP || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400m
    networks:
      - idlakshan

  # ==========================================
  # USER SERVICE
  # ==========================================

  userservice:
    image: idlakshan/milano-user-service:latest
    container_name: userservice
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: user-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://userdb:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      eurekaserver:
        condition: service_healthy
      userdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    networks:
      - idlakshan

  # ==========================================
  # SALON SERVICE
  # ==========================================

  salonservice:
    image: idlakshan/milano-salon-service:latest
    container_name: salonservice
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: salon-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://salondb:3306/salondb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
    depends_on:
      eurekaserver:
        condition: service_healthy
      salondb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    networks:
      - idlakshan

  # ==========================================
  # CATEGORY SERVICE
  # ==========================================

  categoryservice:
    image: idlakshan/milano-category-service:latest
    container_name: categoryservice
    restart: unless-stopped
