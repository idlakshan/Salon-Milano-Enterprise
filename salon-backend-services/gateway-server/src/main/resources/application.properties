spring.application.name=gateway-server
server.port=8070

# === Eureka Registry Configurations ===
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# === Dynamic Route Locator (Auto Discovery) ===
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# === Custom Routing Rules (Manual Routes) ===
# 1. Booking Service Route
spring.cloud.gateway.routes[0].id=booking-service
spring.cloud.gateway.routes[0].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/bookings/**

# 2. Payment Service Route
spring.cloud.gateway.routes[1].id=payment-service
spring.cloud.gateway.routes[1].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/payments/**

# 3. User Service Route (Fixed Multiple Paths)
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/admin/users/**

# 4. Category Service Route
spring.cloud.gateway.routes[3].id=category-service
spring.cloud.gateway.routes[3].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/categories/**

# 5. Offering Service Route
spring.cloud.gateway.routes[4].id=offering-service
spring.cloud.gateway.routes[4].uri=lb://OFFERING-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/service-offering/**

# 6. Salon Service Route
spring.cloud.gateway.routes[5].id=salon-service
spring.cloud.gateway.routes[5].uri=lb://SALON-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/salons,/api/v1/salons/**